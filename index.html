<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>DabbaDoo: INFINITE</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@900&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/phaser@3/dist/phaser.js"></script>
</head>
<body>

  <div id="game-zone">
    <div id="game"></div>
  </div>

  <div id="control-zone">
    <div class="dpad">
      <button id="leftBtn" class="cyber-btn">◀</button>
      <button id="rightBtn" class="cyber-btn">▶</button>
    </div>
    
    <div class="center-pad">
        <button id="restartBtn" class="cyber-btn sm">☠️</button>
    </div>

    <div class="action-pad">
      <button id="dashBtn" class="cyber-btn dash">💨</button>
      <button id="jumpBtn" class="cyber-btn jump">JUMP</button>
    </div>
  </div>

  <script src="main.js"></script>
</body>
</html>
