<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>DabbaDoo | ULTRA</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Bungee&family=Press+Start+2P&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/phaser@3/dist/phaser.js"></script>
</head>
<body>

  <div id="ui-layer">
    <div class="stats-top">
      <div id="hearts-display">🍰🍰🍰</div>
      <div id="score-display">00000</div>
    </div>
  </div>

  <div id="game-wrapper">
    <div id="game"></div>
  </div>

  <div id="mobileControls">
    <div class="dpad">
      <button id="leftBtn" class="control-btn">◀</button>
      <button id="rightBtn" class="control-btn">▶</button>
    </div>
    <div class="action-zone">
      <button id="jumpBtn" class="control-btn jump-btn">JUMP</button>
    </div>
  </div>

  <script src="main.js"></script>
</body>
  </html>
