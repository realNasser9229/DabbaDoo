<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>DabbaDoo: ULTIMATE</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Bungee&family=Press+Start+2P&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/phaser@3/dist/phaser.js"></script>
</head>
<body>
  <div id="game-container"></div>
  
  <div id="controls">
    <div class="dpad">
      <div id="btn-left" class="btn">◀</div>
      <div id="btn-right" class="btn">▶</div>
    </div>
    
    <div class="utility-zone">
      <div id="btn-restart" class="btn reset-btn">↻</div>
    </div>

    <div class="action-zone">
      <div id="btn-jump" class="btn action">JUMP</div>
    </div>
  </div>

  <script src="main.js"></script>
</body>
</html>
